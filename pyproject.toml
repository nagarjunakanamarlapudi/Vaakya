[project]
name = "vaakya"
version = "0.2.0"
description = "Vaakya — meeting notes API (stateless Lambda)"
readme = "README.md"
authors = [
    { name = "Nagarjuna Kanamarlapudi", email = "nagarjuna@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.80",
    "cryptography>=44.0.0",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "huggingface-hub>=1.10.1",
    "mangum>=0.19.0",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.0",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
    "uvicorn[standard]>=0.42.0",
]
